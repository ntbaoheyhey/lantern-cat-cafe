<style>

:root{--bg:#120b19;--bg-2:#1a1220;--surface:#2a1f36;--surface-2:#3a2c4a;--surface-3:#4a3a5e;--border:#72578d;--line:#4b3862;--text:#fff3e0;--muted:#c3aed0;--accent:#ffb86b;--on-accent:#1a1200;--shard:#8fd8ff;--key:#ff8fb1;--good:#6be08a;--bad:#ff6b6b;--focus:#ffd75e;

*{box-sizing:border-box}

button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}.disp{font-family:var(--f-display)}
.lbl{font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
.top h1{font:700 18px var(--f-display);margin:0;color:var(--accent);letter-spacing:.03em}
.top .sp{flex:1}
.seg{display:flex;gap:4px}
.seg button,.chipb{background:var(--surface);border:2px solid var(--line);padding:4px 10px;font:700 12px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed=true],.chipb[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:#000}
.note{color:var(--muted);margin:0 0 10px;font-size:13px;max-width:1200px}.note b{color:var(--text)}
.vp{width:100%;overflow:hidden;border:2px solid var(--line);background:#000;position:relative}
.app{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-template-columns:92px 1fr;grid-template-rows:56px 1fr;background:var(--bg-2);overflow:hidden}
.rail{grid-row:1/3;background:var(--bg);border-right:2px solid #000;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;overflow:hidden}
.logo{font:700 12px/1.1 var(--f-display);color:var(--accent);text-align:center;margin-bottom:6px;text-shadow:2px 2px 0 #000}

.demo{background:var(--bad);color:#2a0606;border:2px solid #000;font:700 10px var(--f-display);letter-spacing:.08em;padding:3px 8px;text-transform:uppercase}

.cols{display:grid;gap:12px;height:100%;min-height:0}.cols>*{min-height:0;min-width:0}
.card{background:var(--surface);border:2px solid var(--border);box-shadow:var(--shadow);padding:10px 12px;min-width:0;min-height:0;overflow:hidden}
.card.scroll{overflow:auto}
.card h2,.card h3{margin:0 0 6px;font:700 15px var(--f-display);color:var(--accent);letter-spacing:.03em}
.btn{background:var(--accent);color:var(--on-accent);border:2px solid #000;box-shadow:var(--shadow);padding:5px 12px;font:700 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.sec{background:var(--surface-3);color:var(--text)}.btn.ghost{background:none;box-shadow:none;border-color:var(--border);color:var(--text)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:11px}
.pill{display:inline-block;padding:0 7px;border:2px solid #000;font:700 10px/16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-3);white-space:nowrap}

.item:hover{background:var(--surface-2)}.item[aria-pressed=true]{background:var(--surface-2);border-color:var(--accent)}

.hist .t{position:relative;height:16px;background:var(--bg);border:2px solid #000}.hist .t b{position:absolute;inset:0 auto 0 0}.hist .t u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;text-decoration:none}
.tip{position:absolute;z-index:20;pointer-events:none;background:#0c0712;border:2px solid var(--accent);box-shadow:var(--shadow);padding:6px 9px;max-width:260px;font-size:12px;line-height:1.35}
.tip b{color:var(--accent)}
input[type=text],input[type=search],input[type=number],select{background:var(--bg);border:2px solid var(--line);padding:4px 8px;color:var(--text)}

.node.on{border-color:var(--accent)}.node.lock{opacity:.45}.node.max{border-color:var(--good)}
.glow{filter:drop-shadow(0 0 4px currentColor)}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.fxsvg *{animation:none!important}}
.kf{transform-box:fill-box;transform-origin:center}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.35}50%{transform:scale(1.15);opacity:.7}}
@keyframes fall{0%{transform:translateY(-120px);opacity:0}15%{opacity:1}60%{transform:translateY(0);opacity:1}61%,100%{transform:translateY(0);opacity:0}}
@keyframes flick{0%,100%{opacity:0}10%,35%{opacity:1}45%{opacity:0}60%,80%{opacity:1}}
@keyframes lock{0%{transform:scale(3);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:1}}
@keyframes domein{0%{transform:scale(.2);opacity:0}30%,100%{transform:scale(1);opacity:.85}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

 for(let i=0;i<N;i++){if(r()<src.gear){let ri=pick(r,w);since++;if(d.pity&&ri<2&&since>=pityK){ri=2;out.pityHits++}out.gear++;out.rar[ri]++;if(ri>=2){out.gaps.push(since);since=0}out.maxDry=Math.max(out.maxDry,since);if(out.feed.length<400)out.feed.push({i,t:'g',ri})}
  Object.entries(src.mats).forEach(([k,[p,a,b]])=>{if(r()<p){const q=a+Math.floor(r()*(b-a+1));out.mats[k]=(out.mats[k]||0)+q}});

function build(b,cls){const t=treeStats(),rs=runeStats(b.run.filter(x=>x[0]).map(([a,tier])=>[a,tier]),1+(t.runepow||0)),st=sumStats(t,rs);const C=CLASSES.find(c=>c.id===cls),atk=40*C.atk*(1+.1*(S.lvl-1)),hp=300*C.hp*(1+.1*(S.lvl-1))*(1+(st.hp||0));
 const crit=Math.min(1,C.crit+(st.crit||0)),cd=1.5+(st.critdmg||0),as=(1000/C.int)*(1+(st.haste||0)),cdr=Math.min(.75,st.cdr||0),dm=1+(st.dmg||0),cf=1+crit*(cd-1);
 const auto=atk*C.hits*as*cf*dm;let sk=0;b.act.forEach(id=>{const s=SK.find(x=>x.id===id);if(!s||!s.dmg)return;const rk=Math.max(1,S.sk[id]||1);sk+=atk*s.dmg*SKR(rk).dm*s.hits*cf*(dm+(st.skill||0))/(Math.max(s.cd*.4,s.cd-.3*(rk-1))*(1-cdr))});
 const dodge=Math.min(.75,st.dodge||0);return{atk,hp,crit,cd,as,cdr,dm,auto,sk,tot:auto+sk,ehp:hp/(1-dodge),dodge,st}}

 <div class="xs muted" style="margin-top:6px">Passives are shared; edit them on the Passives screen. Runes here are free picks to compare ideas, not owned items.</div></div>`;
 return`<div class="cols" style="grid-template-columns:300px 1fr 300px">${panel('A',S.pl.A)}<div class="card scroll"><div class="row"><h3 style="margin:0">Compare</h3><span class="grow"></span>${sel('class',CLASSES.map(c=>[c.id,c.n]),cls,'plcls')}</div>
 <table style="margin-top:6px"><tr><th>Stat</th><th>A</th><th>B</th><th>B vs A</th></tr>${[['Total DPS',A.tot,B.tot],['Auto-attack DPS',A.auto,B.auto],['Skill DPS',A.sk,B.sk],['Effective HP',A.ehp,B.ehp]].map(([n,a,b])=>`<tr><td><b>${n}</b></td><td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td><td class="num">${d(a||1,b)}</td></tr>`).join('')}${[['Crit chance',A.crit,B.crit],['Crit damage',A.cd,B.cd],['Attack speed',A.as,B.as],['Cooldown reduction',A.cdr,B.cdr]].map(([n,a,b])=>`<tr><td>${n}</td><td class="num">${n==='Attack speed'?a.toFixed(2)+'/s':n==='Crit damage'?(a*100).toFixed(0)+'%':pct(a)}</td><td class="num">${n==='Attack speed'?b.toFixed(2)+'/s':n==='Crit damage'?(b*100).toFixed(0)+'%':pct(b)}</td><td></td></tr>`).join('')}</table>
 <h3 style="margin-top:10px">Published formulas</h3><div class="logbox" style="background:var(--bg);border:2px solid #000;padding:8px;font:500 11.5px/1.6 var(--f-num)">auto DPS = ATK × hits × atk/s × (1 + crit × (critDmg − 1)) × (1 + Σ dmg%)<br>skill DPS = ATK × skill% × rank × hits × crit factor × (1 + Σ dmg% + skill%) ÷ (CD × (1 − CDR))<br>CDR capped at 75%. Everything is additive inside one pool, then multiplied once.</div>
 <div class="xs muted" style="margin-top:6px">Level ${S.lvl}, ATK/HP use demo scaling. Use this to settle build arguments, not to predict the real game.</div></div>${panel('B',S.pl.B)}</div>`};

function tipShow(el){const tip=$('#tip');if(!el||!tip)return;tip.innerHTML=el.dataset.tip;tip.style.display='block';const sc=+app.dataset.sc||1,a=app.getBoundingClientRect(),r=el.getBoundingClientRect();let x=(r.left-a.left)/sc,y=(r.bottom-a.top)/sc+6;const w=tip.offsetWidth,h=tip.offsetHeight;x=clamp(x,4,S.W-w-4);if(y+h>S.W*9/16-4)y=(r.top-a.top)/sc-h-6;tip.style.left=x+'px';tip.style.top=y+'px'}
const tipHide=()=>{const t=$('#tip');if(t)t.style.display='none'};
app.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');t?tipShow(t):tipHide()});app.addEventListener('mouseleave',tipHide);
app.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]');t?tipShow(t):tipHide()});app.addEventListener('focusout',tipHide);
document.addEventListener('keydown',e=>{if(e.key==='Escape')tipHide()});
$('#size').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.W=+b.dataset.w;[...$('#size').children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#pause').addEventListener('change',e=>app.classList.toggle('paused',e.target.checked));
if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('#pause').checked=true;app.classList.add('paused')}
addEventListener('resize',fit);
const h0=(location.hash||'').slice(1);if(V[h0])S.scr=h0;
render();
</script></body></html>

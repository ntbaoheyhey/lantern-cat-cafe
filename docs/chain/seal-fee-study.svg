<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="title desc"><title id="title">50% tham gia, forge trước</title><desc id="desc">Cùng9 lượt cho mỗi mức phí. Cột là tỷ lệ hoàn thành forge thấp nhất ở tuần13; nhãn nêu tỷ lệ phát trên đốt xấu nhất.</desc><rect width="780" height="340" rx="18" fill="#15263b"/><g fill="#edf4ff" font-family="system-ui"><text x="28" y="35" font-size="20">50% tham gia · Forge trước · 9 lượt/mức phí</text><text x="28" y="63" font-size="15">Hoàn thành ở tuần 13 (thấp nhất) và phát/đốt (xấu nhất)</text><rect x="72" y="100" width="100" height="150" rx="5" fill="#62d5b1"/><text x="122" y="85" text-anchor="middle" font-size="19">100.0%</text><text x="122" y="278" text-anchor="middle" font-size="18">Phí 2.5%</text><text x="122" y="308" text-anchor="middle" font-size="16">Phát/đốt 2.788</text><rect x="252" y="100" width="100" height="150" rx="5" fill="#62d5b1"/><text x="302" y="85" text-anchor="middle" font-size="19">100.0%</text><text x="302" y="278" text-anchor="middle" font-size="18">Phí 5%</text><text x="302" y="308" text-anchor="middle" font-size="16">Phát/đốt 2.395</text><rect x="432" y="100" width="100" height="150" rx="5" fill="#62d5b1"/><text x="482" y="85" text-anchor="middle" font-size="19">100.0%</text><text x="482" y="278" text-anchor="middle" font-size="18">Phí 7.5%</text><text x="482" y="308" text-anchor="middle" font-size="16">Phát/đốt 2.598</text><rect x="612" y="101.171875" width="100" height="148.828125" rx="5" fill="#62d5b1"/><text x="662" y="86.171875" text-anchor="middle" font-size="19">99.2%</text><text x="662" y="278" text-anchor="middle" font-size="18">Phí 10%</text><text x="662" y="308" text-anchor="middle" font-size="16">Phát/đốt 2.623</text></g></svg>
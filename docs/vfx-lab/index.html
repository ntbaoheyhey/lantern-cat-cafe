<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern Cat Café · VFX Lab</title><style>
@font-face{font-family:Baloo;src:url('../../apps/web/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#171321;color:#ffefce;font:17px Baloo,serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0;color:#f3ca80;font-size:38px}p{opacity:.7}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;padding:10px 18px;background:#32273c;color:#ffeaca;border:1px solid #8c6e59;border-radius:9px}button{cursor:pointer}input[type=range]{flex:1;min-width:200px;accent-color:#e6b96e}.stage{aspect-ratio:16/9;background:#231a30;position:relative;overflow:hidden;border-radius:16px;border:1px solid #725c56}.stage video,.stage img{width:100%;height:100%;object-fit:contain}.stage img{display:none}.stage.before video{display:none}.stage.before img{display:block}output{font-variant-numeric:tabular-nums;color:#eaca89}label{display:flex;gap:8px;align-items:center}a{color:#c3edc7}.badge{position:absolute;top:18px;left:18px;padding:5px 12px;background:#151125aa;border:1px solid #ffffff22;border-radius:40px;font-size:13px}
</style></head><body><main><h1>Lantern Cat Café</h1><p>Skill cinema workbench · original painted art, fixed 30 fps</p><nav><label>Unit <select id="unit"></select></label><label>Skill <select id="skill"><option value="ult">Ultimate</option><option value="1">Basic</option><option value="2">Active 1</option><option value="3">Active 2</option></select></label><button id="play">Play</button><label>Speed <select id="speed"><option value="1">×1</option><option value="0.25">×0.25</option><option value="0.5">×0.5</option></select></label><button id="compare" aria-pressed="false">Show before</button><label><input id="sound" type="checkbox"> Sound</label></nav><div class="stage" id="stage"><video id="video" playsinline muted preload="auto"></video><img id="before" alt="Approved painted skill layers before cinematic composition"><span class="badge" id="badge">AFTER · FULL PLATE</span></div><nav><input aria-label="Scrub clip" id="scrub" type="range" min="0" max="1000" value="0"><output id="time">0.00 / 2.27 s</output></nav><p id="note">Impact is frame 51. The in-game field contact follows the clip at 3.20 seconds; the HUD stays visible.</p><p><a href="../../reports/v3-battle/A3/">Pilot reviews and timing evidence</a> · <a href="http://127.0.0.1:5990/?demo=1&squad=1&cardrpg2=1&a6=1&dev=1">Open local battle preview</a></p></main><script>
const ids=['mochi','soot','clover','panko','mallow','sorrel','biscuit','inkcap','cinnamon','brioche','velvet','marigold','yarn-giant'];const $=id=>document.getElementById(id),v=$('video');let audio;
ids.forEach(id=>$('unit').add(new Option(id[0].toUpperCase()+id.slice(1),id)));
function load(){v.pause();const id=$('unit').value,skill=$('skill').value;v.innerHTML=`<source src="../../apps/web/public/cinematics/${id}-ult.webm" type="video/webm"><source src="../../apps/web/public/cinematics/${id}-ult.mp4" type="video/mp4">`;v.poster=`../../apps/web/public/cinematics/${id}-ult-poster.webp`;v.load();const key=id==='yarn-giant'?'enemy-yarn-giant':id+'-'+(skill==='ult'?'4':skill);$('before').src='../../assets/cardrpg-look/vfx-layered/'+key+'.webp';$('stage').classList.toggle('before',skill!=='ult');$('badge').textContent=skill==='ult'?'AFTER · FULL PLATE':'PAINTED FIELD LAYERS';$('note').textContent=skill==='ult'?'Impact is frame 51. In-game field contact follows the plate at 3.20 seconds.':'On-field skills use the approved layered painting. Open the local battle preview to inspect live timing and targets.';}
$('unit').onchange=$('skill').onchange=load;$('play').onclick=()=>{if(v.paused){v.play();if($('sound').checked){audio?.pause();audio=new Audio('./audio/release.mp3');audio.volume=.5;audio.play().catch(()=>{});}}else v.pause();};$('speed').onchange=()=>v.playbackRate=+$('speed').value;$('scrub').oninput=()=>{v.pause();v.currentTime=+$('scrub').value/1000*(v.duration||2.27);};$('compare').onclick=()=>{const before=$('stage').classList.toggle('before');$('compare').textContent=before?'Show after':'Show before';$('compare').setAttribute('aria-pressed',before);$('badge').textContent=before?'BEFORE · PAINTED LAYERS':'AFTER · FULL PLATE';};v.ontimeupdate=()=>{$('scrub').value=v.currentTime/(v.duration||2.27)*1000;$('time').textContent=v.currentTime.toFixed(2)+' / '+(v.duration||2.27).toFixed(2)+' s';};load();
</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lantern audio lab</title><link rel="stylesheet" href="../../apps/web/src/ui/typography.css"><style>body{margin:2rem;background:#181325;color:#fff2d3}button{background:#5a345b;color:white;border:1px solid #cc9e55;border-radius:8px;padding:.65rem}article{display:flex;gap:1rem;align-items:center;padding:.4rem;border-bottom:1px solid #665269}small{opacity:.75}input{padding:.6rem}output{display:block}</style><h1 class="t-title">Lantern sound board</h1><p>CC0 samples. Click a cue to unlock sound. Local sprite playback.</p><input id="filter" placeholder="Filter cues" aria-label="Filter cues"><output id="status">Loading manifest…</output><main></main><script type="module">
const base=new URL('../../apps/web/public/audio/',location.href),m=await fetch(new URL('manifest.json',base)).then(r=>r.json()),licenses=await fetch(new URL('LICENSES.json',base)).then(r=>r.json());let ctx;const buffers=new Map();
async function play(id){ctx??=new AudioContext();await ctx.resume();const s=m.cues[id][0];let b=buffers.get(s.pack);if(!b){for(const type of ['webm','mp3'])try{b=await ctx.decodeAudioData(await fetch(new URL(m.packs[s.pack][type].split('/').pop(),base)).then(r=>r.arrayBuffer()));break;}catch{}if(!b)throw Error('No supported audio');buffers.set(s.pack,b);}const n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start(0,s.start,Math.min(5,s.duration));document.querySelector('output').textContent=id+' • playing';}
const main=document.querySelector('main');for(const [id,rows] of Object.entries(m.cues)){const row=document.createElement('article'),button=document.createElement('button'),license=document.createElement('small');row.dataset.cue=id;button.textContent=id;button.onclick=()=>play(id).catch(e=>document.querySelector('output').textContent=e.message);const l=licenses.files.find(l=>l.file===rows[0].pack+'.webm');license.textContent=l.author+' • '+l.license;row.append(button,license);main.append(row);}document.querySelector('output').textContent=Object.keys(m.cues).length+' cues ready';document.querySelector('input').oninput=e=>{for(const row of main.children)row.hidden=!row.dataset.cue.includes(e.target.value);};
</script></html>

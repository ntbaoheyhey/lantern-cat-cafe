name: CI
# Actions minutes are allowed again (user, 2026-10-28), so CI runs on every pull request and can still be
# started by hand (Actions > CI > Run workflow). scripts/verify-pr.sh stays as the fallback.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.f.outputs.code }}
      web: ${{ steps.f.outputs.web }}
      contracts: ${{ steps.f.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          echo "$files"
          flag() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # code: anything except docs, markdown and screenshots; web: what the app build/e2e depends on.
          code=$(echo "$files" | grep -Ev '^(docs/|screenshots/)|\.md$' | grep -c . || true)
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(flag '^(apps/web/|packages/|pnpm-lock.yaml|package.json|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "contracts=$(flag '^(contracts/|packages/chain/|\.gitmodules|\.github/)')" >> "$GITHUB_OUTPUT"
  node:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:deno
      - run: git diff --exit-code -- supabase/functions
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  # Playwright runs on every PR and on manual runs.
  e2e:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Match the reviewed Linux pixel fixtures, including fallback symbol fonts.
    # Chromium and pinned web-font bytes alone do not fix host font rasterization.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned image supplies system libraries/fonts; do not upgrade them via apt.
      - run: pnpm exec playwright install chromium
        working-directory: apps/web
      - run: pnpm --filter @taskbar-hero/web build
      - name: Check native screenshot and font fixtures
        run: pnpm --filter @taskbar-hero/web exec playwright test e2e/ui/art2-flag-off.spec.ts e2e/ui/landing-font-stability.spec.ts --project=stage-layout --workers=2
        env:
          ART2_SCREENSHOTS: ${{ github.workspace }}/apps/web/test-results/flag-off-native
      - run: pnpm --filter @taskbar-hero/web test:e2e
        env:
          ART2_SCREENSHOTS: ${{ github.workspace }}/apps/web/test-results/flag-off-native
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv
      # Deploy.t.sol rewrites packages/chain/deployments/31337.json; gen rewrites the ABIs.
      # Both must match what is committed.
      - run: node ../packages/chain/scripts/gen-abi.mjs
      - run: git diff --exit-code -- ../packages/chain
  chain-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: node tools/chain/check-drip.mjs
      - run: node tools/chain/check-move.mjs
      - run: node tools/chain/fuji-smoke.mjs --dry-run
      - run: node tools/chain/seed-market.mjs --dry-run
      - run: node --test tools/chain/*.test.mjs
      - run: node tools/chain/token-sim.mjs
      - name: Three consecutive fresh Fuji-ID Anvil runs
        run: |
          for attempt in 1 2 3; do
            pnpm chain:test || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-evidence
          path: |
            apps/web/test-results/chain/
            reports/chain/shots/
          retention-days: 7

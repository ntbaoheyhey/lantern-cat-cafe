<title>Taskbar Hero UI Draft</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one dark world (cozy cat cafe at night). Toolbar on top, a scaled 1280x720 / 1600x900 app frame below.
   App frame = left rail + HUD + stage + right context panel. Tokens extend apps/web/src/theme.css. */
:root{
  --bg:#120b19; --bg-2:#1a1220; --surface:#2a1f36; --surface-2:#3a2c4a; --surface-3:#4a3a5e;
  --border:#72578d; --line:#4b3862; --text:#fff3e0; --muted:#c3aed0; --accent:#ffb86b; --on-accent:#1a1200;
  --shard:#8fd8ff; --key:#ff8fb1; --good:#6be08a; --bad:#ff6b6b; --focus:#ffd75e;
  --r-common:#b9b6c9; --r-rare:#4aa8ff; --r-epic:#bb74ff; --r-legend:#ff9a3c;
  --f-display:'Pixelify Sans',ui-monospace,monospace; --f-body:'DM Sans',system-ui,sans-serif; --f-num:'JetBrains Mono',ui-monospace,monospace;
  --px:2px solid #000; --shadow:3px 3px 0 #000; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display)}
.lbl{font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.bar h1{font:700 18px var(--f-display);margin:0;color:var(--accent);letter-spacing:.03em}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.tabs button,.size button{background:var(--surface);border:2px solid var(--line);padding:4px 10px;font:700 12px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected=true],.size button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:#000}
.size{display:flex;gap:4px}
.note{max-width:1100px;color:var(--muted);margin:0 0 10px;font-size:13px}
.note b{color:var(--text)}

/* frame */
.vp{width:100%;overflow:hidden;border:2px solid var(--line);background:#000;position:relative}
.app{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-template-columns:92px 1fr;grid-template-rows:56px 1fr;background:var(--bg-2);overflow:hidden}
.app[hidden]{display:none}
.rail{grid-row:1/3;background:var(--bg);border-right:2px solid #000;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px}
.logo{font:700 13px/1.1 var(--f-display);color:var(--accent);text-align:center;margin-bottom:8px;text-shadow:2px 2px 0 #000}
.nav{width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:2px solid transparent;background:none;color:var(--muted);font:700 11px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.nav svg{width:26px;height:26px}
.nav[aria-current=page]{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow);color:var(--accent)}
.nav:hover{color:var(--text)}
.rail .sp{flex:1}
.hud{display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface);border-bottom:2px solid #000}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);padding:3px 10px;font:500 13px var(--f-num)}
.chip i{width:10px;height:10px;display:inline-block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35)}
.xp{flex:1;max-width:260px}
.bar-t{height:10px;background:var(--bg);border:2px solid #000;position:relative}
.bar-t b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.wallet{margin-left:auto;display:flex;gap:8px;align-items:center}
.main{position:relative;padding:16px 18px;overflow:hidden;min-height:0}
.cols{display:grid;gap:14px;height:100%;min-height:0}
.card{background:var(--surface);border:2px solid var(--border);box-shadow:var(--shadow);padding:12px 14px;min-width:0;min-height:0}
.card h2,.card h3{margin:0 0 8px;font:700 15px var(--f-display);color:var(--accent);letter-spacing:.03em}
.btn{background:var(--accent);color:var(--on-accent);border:2px solid #000;box-shadow:var(--shadow);padding:7px 16px;font:700 13px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.sec{background:var(--surface-3);color:var(--text);border-color:#000}
.btn.ghost{background:none;box-shadow:none;border-color:var(--border);color:var(--text)}
.btn.lg{padding:11px 24px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:1px 8px;border:2px solid #000;font:700 10px var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-3)}
.pill.good{background:var(--good);color:#06240f}.pill.bad{background:var(--bad);color:#2a0606}.pill.epic{background:var(--r-epic);color:#1a0630}.pill.rare{background:var(--r-rare);color:#021a33}.pill.leg{background:var(--r-legend);color:#2a1200}.pill.com{background:var(--r-common);color:#17151f}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat span:last-child{font-family:var(--f-num)}
.cat{width:64px;height:64px;image-rendering:pixelated}
svg.px{shape-rendering:crispEdges}

/* scene */
.scene{position:relative;border:2px solid #000;overflow:hidden;background:linear-gradient(#1c1030 0%,#3a2150 55%,#5a3560 100%);min-height:0}
.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 10% 14%,#fff8 50%,transparent),radial-gradient(1.5px 1.5px at 32% 26%,#fff8 50%,transparent),radial-gradient(1.5px 1.5px at 58% 10%,#fff8 50%,transparent),radial-gradient(1.5px 1.5px at 82% 22%,#fff8 50%,transparent),radial-gradient(1.5px 1.5px at 92% 8%,#fff8 50%,transparent)}
.moon{position:absolute;right:9%;top:12%;width:46px;height:46px;border-radius:50%;background:#ffe7b0;box-shadow:-10px 4px 0 0 #3a2150 inset}
.roofs{position:absolute;left:0;right:0;bottom:30%;height:90px;background:repeating-linear-gradient(90deg,#2a1840 0 60px,#241437 60px 100px);clip-path:polygon(0 60%,8% 60%,8% 30%,16% 30%,16% 55%,30% 55%,30% 20%,42% 20%,42% 50%,60% 50%,60% 35%,72% 35%,72% 55%,100% 55%,100% 100%,0 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#4b2f5e 0 32px,#43294f 32px 64px);border-top:3px solid #000}
.actor{position:absolute;bottom:26%}
.hpbar{width:70px;height:8px;background:#000;border:2px solid #000;position:absolute;top:-16px;left:-3px}
.hpbar b{display:block;height:100%;background:var(--bad)}
.float{position:absolute;font:700 16px var(--f-num);color:var(--focus);text-shadow:2px 2px 0 #000}
.logbox{font:500 12px/1.6 var(--f-num);color:var(--muted);background:var(--bg);border:2px solid #000;padding:8px 10px}
.logbox em{color:var(--accent);font-style:normal}

/* grids */
.slots{display:grid;gap:6px}
.slot{aspect-ratio:1;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;position:relative}
.slot.r1{border-color:var(--r-rare)}.slot.r2{border-color:var(--r-epic);box-shadow:0 0 0 1px var(--r-epic) inset}.slot.r3{border-color:var(--r-legend);box-shadow:0 0 12px #ff9a3c55,0 0 0 1px var(--r-legend) inset}
.slot.sel{outline:3px solid var(--focus);outline-offset:1px}
.slot .q{position:absolute;right:3px;bottom:1px;font:700 10px var(--f-num)}
.slot.empty{border-style:dashed;opacity:.55}
.ico{width:34px;height:34px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:700 11px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:7px 8px;border-bottom:1px dashed var(--line)}
tr.hl td{background:var(--surface-2)}
.toast{position:absolute;right:20px;bottom:20px;background:var(--surface-2);border:2px solid var(--good);box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:6}
.scrim{position:absolute;inset:0;background:#0009;display:grid;place-items:center;z-index:5}
.modal{width:460px;background:var(--surface);border:3px solid var(--accent);box-shadow:6px 6px 0 #000;padding:18px 20px}
.modal h2{margin:0 0 6px;font:700 20px var(--f-display);color:var(--accent)}
.node{position:absolute;width:76px;text-align:center;font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.node i{display:block;width:36px;height:36px;margin:0 auto 4px;border:3px solid #000;background:var(--surface-3);transform:rotate(45deg)}
.node.done i{background:var(--good)}.node.cur i{background:var(--accent);box-shadow:0 0 0 3px var(--focus)}.node.lock i{background:#2a2433;opacity:.7}.node.boss i{background:var(--bad);width:44px;height:44px}
.hero{height:100%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px;padding:0 40px}
.hero h1{font:700 62px/1 var(--f-display);margin:0 0 14px;color:var(--accent);text-shadow:4px 4px 0 #000}
.hero p{font-size:17px;max-width:480px;color:var(--text)}
.mini{display:grid;gap:14px}

.doc{max-width:860px;margin:0 auto;padding:8px 0 40px;font-size:15px;line-height:1.6}
.doc h2{font:700 26px var(--f-display);color:var(--accent);margin:8px 0 10px;text-wrap:balance}
.doc h3{font:700 19px var(--f-display);color:var(--accent);margin:26px 0 8px}
.doc h4{font:700 15px var(--f-display);margin:20px 0 6px}
.doc code{font:500 13px var(--f-num);background:var(--surface);padding:1px 5px}
.doc ul{padding-left:20px}.doc li{margin:3px 0}
.cb{position:relative;margin:8px 0}.cb pre{margin:0;background:var(--bg-2);border:2px solid var(--line);padding:12px 14px;font:500 12.5px/1.55 var(--f-num);white-space:pre-wrap;overflow-wrap:anywhere}
.cp{position:absolute;right:8px;top:8px;background:var(--accent);color:var(--on-accent);border:2px solid #000;font:700 11px var(--f-display);padding:2px 10px}
.tw{overflow-x:auto;margin:10px 0}
</style>

<template id="t-prompts"><h2>Prompts (living draft)</h2><p>Design approved 31 Oct. Codex and Antigravity code first; Claude CLI is not available yet. All copy-ready prompts are in one file in the project folder: <code>PASTE-ALL-redesign.txt</code> (index: <code>PASTE-INDEX-redesign.md</code>). Repo copy: <code>tasks/v2/redesign/</code>. Art rule: all existing images are kept.</p><h3>Order</h3><div class="tw"><table><tr><th>Step</th><th>Mission</th><th>Tool</th><th>When</th></tr><tr><td>1</td><td>AGR0 tokens + shell (left rail, top HUD)</td><td>Antigravity</td><td>Paste first. Blocks all UI phases.</td></tr><tr><td>1</td><td>CXR0 test harness (1600x900 audit, e2e smoke)</td><td>Codex</td><td>Paste now, parallel with AGR0.</td></tr><tr><td>2</td><td>AGR1 Landing, class picker, Home</td><td>Antigravity</td><td>After AGR0 merges.</td></tr><tr><td>2</td><td>AGR2 Bag</td><td>Antigravity</td><td>After AGR0 merges.</td></tr><tr><td>2</td><td>AGR3 Forge + Market</td><td>Antigravity</td><td>After AGR0 merges.</td></tr><tr><td>2</td><td>AGR4 Hero, Help, shared states</td><td>Antigravity</td><td>After AGR0 merges.</td></tr><tr><td>2</td><td>AGR5 Map (boss)</td><td>Antigravity</td><td>After AGR0 and the boss scroll PR merge.</td></tr><tr><td>3</td><td>CXR1 tests for new screens</td><td>Codex</td><td>After AGR1-AGR4 merge.</td></tr><tr><td>4</td><td>CXR2 polish pass</td><td>Codex</td><td>After the above, repeatable.</td></tr></table></div><p>Antigravity has two accounts, so at most two of AGR1-AGR5 run at once.</p></template><template id="t-brief"><h2>Taskbar Hero UI redesign: design brief (living draft v0)</h2>
<p>Status: draft for the user&#x27;s review. Nothing here is final. Game rules, contracts, auth, schema (Tier 3) are untouched. Desktop first, no mobile work yet.</p>
<h3>1. Goals</h3>
<ul>
<li><b>Art rule (user, 31 Oct):</b> Keep ALL existing images and art assets (sprites, backgrounds, icons, cat art, Relic art). Reuse them as they are; never replace or delete any. New art only as additions, and only if the user asks. The mockup's simple placeholder cats and icons are stand-ins only; the real build uses the current art folders.</li>
<li>A full-screen web app that feels like one cozy cat cafe at night, not a strip of tabs.</li>
<li>Judges (Technical + Avalanche Integration) see on-chain proof fast: Fuji badge, Relic id, contract link, Routescan.</li>
<li>Every screen has one primary action and one place to look first.</li>
<li>Keep pixel-art identity and the existing tokens in <code>apps/web/src/theme.css</code>.</li>
</ul>
<h3>2. Reference (inspiration only, no copied assets, text or code)</h3>
<p>tbhindex.com blocked automated access from our environment (Cloudflare), so the structure below comes from the user&#x27;s description of it: a persistent left navigation, data-dense list/detail screens, and a clear split between a data index and the game. The user should confirm which parts of that site they like (see decision list in the report).</p>
<h3>3. Information architecture and navigation</h3>
<p>Model: persistent left rail (7 entries) + top HUD + content + optional right context panel.</p>
<ul>
<li>Landing (before play, no rail) -&gt; Class picker (first run only) -&gt; Home.</li>
<li>Rail: Home, Bag, Map, Forge, Market, Hero, Help. Fuji status badge at the bottom.</li>
<li>HUD (always): Gold, Shards, Cat Keys, level + XP bar, Power, wallet button.</li>
<li>Mapping from today&#x27;s tabs: Hero tab -&gt; Home (stage) + Hero (sheet); Inventory -&gt; Bag; Boss -&gt; Map; Forge -&gt; Forge; Market -&gt; Market. Help becomes a screen, not a modal.</li>
<li>Right panel pattern: list/grid on the left, detail + actions on the right. Actions never live inside the list.</li>
</ul>
<h3>4. Screens</h3>
<p>1. Landing: hero scene, promise, Play as guest, Connect wallet (secondary), proof strip.</p>
<p>2. Class picker: three cards, one selected, one primary button.</p>
<p>3. Home (stage): living scene, hero card, next goal, recent loot, event log.</p>
<p>4. Bag: 8-column grid with visible empty slots, filters, detail + compare panel.</p>
<p>5. Map (boss): winding path with nodes, fight card (recommended power, daily attempts, rewards, past runs).</p>
<p>6. Forge: pick gear, materials, chances table, reveal in the centre pane.</p>
<p>7. Market: Relics only, sortable table, on-chain facts + Routescan link, your listings.</p>
<p>8. Hero: paper-doll equipment, stats, power breakdown, change class.</p>
<p>9. Help: topic list + answer, search.</p>
<p>10. Shared states: confirm modal, toasts (success, warning, failure), offline banner, empty bag.</p>
<h3>5. Design tokens (extends theme.css)</h3>
<ul>
<li>Colour: bg #120b19 (new, rail/page) over #1a1220, surfaces #2a1f36 / #3a2c4a / #4a3a5e, border #72578d, text #fff3e0, muted #c3aed0, accent #ffb86b. Semantic: good #6be08a, bad #ff6b6b, shard #8fd8ff, key #ff8fb1. Rarity: common #b9b6c9, rare #4aa8ff, epic #bb74ff, legendary #ff9a3c.</li>
<li>Type: Pixelify Sans (headings, buttons, labels), DM Sans (body, 14px base), JetBrains Mono (all numbers, tabular).</li>
<li>Spacing: 4 / 8 / 12 / 16 / 24 / 32. Screen padding 16-18px, card gap 14px.</li>
<li>Frames: 2px border + 3px hard black shadow on cards and buttons; buttons press down 2px. Rarity = frame colour AND a text pill.</li>
<li>Frame sizes: design at 1280x720 and 1600x900. Rail 92px, HUD 56px, right panel 320-340px. Content flexes.</li>
<li>Motion: only hit numbers, loot pop, forge flash. All respect prefers-reduced-motion.</li>
</ul>
<h3>6. Components</h3>
<p>Rail nav item, HUD chip, XP bar, Card, Button (primary/secondary/ghost/large), Pill, Item slot (+ empty, selected, rarity), Item icon set, Stat row, Data table, Scene canvas wrapper, Event log, Map node, Modal, Toast, Banner, Empty state, Search field, Filter chips, Progress bar.</p>
<h3>7. Open questions for the user</h3>
<ul>
<li>Keep Pixelify Sans, or try a more readable pixel face for long text?</li>
<li>Is the left rail OK, or prefer top tabs like today?</li>
<li>Should Home also show a mini boss progress, or keep it only on Map?</li>
</ul></template><template id="t-plan"><h2>Implementation plan (living draft)</h2>

<script>

V.help=()=>shell('help',`<div class="cols" style="grid-template-columns:260px 1fr"><div class="card"><input id="hs" placeholder="Search help" style="width:100%;background:var(--bg);border:2px solid var(--line);color:var(--text);padding:6px 8px;font:inherit;margin-bottom:8px">${['Getting started','Fighting','Gear and rarity','Forge','Relics and wallet','Market','Fixing problems'].map((t,i)=>`<div class="stat" style="${i===3?'color:var(--accent);font-weight:700':''}"><span>${t}</span><span>›</span></div>`).join('')}</div>

V.states=()=>shell('help',`<div class="cols" style="grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;align-content:start"><div class="card" style="border-color:var(--bad);grid-column:1/3"><div class="row"><span class="pill bad">Offline</span><span class="grow">The server did not answer. Your cat keeps fighting; progress will sync when the connection returns.</span><button class="btn sec">Retry</button></div></div>

SCREENS.push(['prompts','Prompts','Order to paste and which tool runs each mission. Text: tasks/v2/redesign/ and PASTE-ALL-redesign.txt.'],['brief','Design brief','Goals, navigation model, screen list, tokens, components. Text version: reports/ui-redesign/BRIEF.md.'],['plan','Plan + prompts','Phases split between Claude, Codex and Antigravity with ready paste prompts, plus optional connectors. Text version: reports/ui-redesign/PLAN.md.']);
const tabs=document.getElementById('tabs'),vp=document.getElementById('vp'),note=document.getElementById('note');
let W=1280,cur='landing';
SCREENS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('role','tab');b.dataset.k=k;tabs.appendChild(b)});
function render(){
  const doc=document.getElementById('doc'),isDoc=['brief','plan','prompts'].includes(cur);
  document.getElementById('size').style.visibility=isDoc?'hidden':'visible';
  doc.hidden=!isDoc;vp.hidden=isDoc;
  if(isDoc){doc.innerHTML=document.getElementById('t-'+cur).innerHTML;doc.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{const t=b.nextElementSibling.textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copied',()=>{const r=document.createRange();r.selectNodeContents(b.nextElementSibling);const g=getSelection();g.removeAllRanges();g.addRange(r);b.textContent='Selected'})});
    [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));const s=SCREENS.find(x=>x[0]===cur);note.innerHTML=`<b>${s[1]}.</b> ${s[2]}`;try{history.replaceState(null,'','#'+cur)}catch(e){};return}

  const H=W*9/16;const app=document.createElement('div');app.className='app';app.style.cssText=`width:${W}px;height:${H}px`;
  app.innerHTML=V[cur]();if(cur==='landing'||cur==='class')app.style.gridTemplateColumns='1fr';
  vp.innerHTML='';vp.appendChild(app);fit();
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
  const s=SCREENS.find(x=>x[0]===cur);note.innerHTML=`<b>${s[1]}.</b> ${s[2]}`;
  try{history.replaceState(null,'','#'+cur)}catch(e){}
}
function fit(){const a=vp.firstChild;if(!a)return;const sc=vp.clientWidth/W;a.style.transform=`scale(${sc})`;vp.style.height=(W*9/16*sc)+'px'}
tabs.onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;render()}};
vp.onclick=e=>{const g=e.target.closest('[data-go]');if(g&&V[g.dataset.go]){cur=g.dataset.go;render()}};
document.getElementById('size').onclick=e=>{const w=e.target.dataset.w;if(w){W=+w;[...e.currentTarget.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===w));render()}};
addEventListener('resize',fit);
const h=location.hash.slice(1);if(V[h]||['brief','plan','prompts'].includes(h))cur=h;
document.fonts&&document.fonts.ready.then(fit);
render();
</script>
